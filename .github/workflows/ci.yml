name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是 README 承诺的最低版本；3.12 是当前主流
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: pip install numpy ruff
      - name: Lint (ruff)
        run: ruff check backend
      - name: Unit & API tests
        working-directory: backend
        run: python -m unittest discover -s tests
